# 프론트엔드 개발 서버 주소. frontend/vite.config.js 의 server.port 와 같아야 한다.
# 개발 중에는 Vite 프록시를 거치므로 CORS 가 필요 없지만, 프론트를 따로 띄울 때 이 값이 쓰인다.
client:
  url: http://localhost:5173

server:
  port: 8080

spring:
  application:
    name: simpleboard

  datasource:
    url: jdbc:mysql://localhost:3306/simpleboard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    # docker-compose.yml 의 MYSQL_ROOT_PASSWORD 와 같은 기본값이다. 운영에서는 환경변수로 덮어쓴다.
    password: ${DB_PASSWORD:rootpassword}

  jpa:
    hibernate:
      # 개발 편의를 위해 엔티티에서 스키마를 만든다. 운영에서는 validate 로 바꾸고 마이그레이션 도구를 쓴다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  # 회원가입 이메일 인증에 쓴다. app.mail.enabled 가 true 일 때만 실제로 사용된다.
  # Gmail 은 계정 비밀번호가 아니라 앱 비밀번호를 넣어야 한다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    # false 면 인증번호를 메일로 보내지 않고 서버 로그에 찍는다. SMTP 계정 없이 개발할 때 쓴다.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_USERNAME:noreply@simpleboard.local}
    code-ttl: 5m
    verified-ttl: 30m
    resend-cooldown: 30s
    max-attempts: 5

  jwt:
    # HS256 은 32바이트 이상의 키를 요구한다. 운영에서는 반드시 환경변수로 덮어쓴다.
    access-secret: ${JWT_ACCESS_SECRET:simpleboard-local-development-access-secret-key-change-me}
    refresh-secret: ${JWT_REFRESH_SECRET:simpleboard-local-development-refresh-secret-key-change-me}
    access-token-validity-seconds: 1800        # 30분
    refresh-token-validity-seconds: 1209600    # 14일
  cookie:
    # 로컬은 http 라서 Secure 쿠키를 쓸 수 없다. https 로 배포하면 secure: true, same-site: None 으로 바꾼다.
    secure: false
    same-site: Lax
    domain: ""

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

---
# 로컬에서 DB 없이 띄워보고 싶을 때: --spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:simpleboard;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
